services:
  postgres:
    image: postgres:17
    container_name: book-postgres
    # Come back after a reboot or crash (unless stopped on purpose with "docker compose stop").
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # "Healthy" once Postgres accepts connections, so the API can wait for it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    container_name: platform-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # The owner's password, as a bcrypt hash. Generate with scripts/hash-password.sh and
      # put it in .env inside single quotes (OWNER_PASSWORD_HASH='$2y$...'), so the "$"s stay as they are.
      API_PASSWORD_HASH: ${OWNER_PASSWORD_HASH:?Set OWNER_PASSWORD_HASH in .env (scripts/hash-password.sh)}
      # Signs the session tokens. Changing it signs every device out.
      API_SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env (openssl rand -hex 32)}
      # Touch ID sign-in on the web: the site's host name (empty turns it off), and the
      # passkeys registered with "Set up Touch ID" (comma-separated; remove one to revoke it).
      API_PASSKEY_RP_ID: ${SITE_HOST:-}
      API_PASSKEY_CREDENTIALS: ${PASSKEYS:-}
    # After a reboot, start only once the database is ready (not merely started).
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
