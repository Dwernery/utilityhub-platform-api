spring.datasource.url=jdbc:postgresql://localhost:5432/utility_hub
spring.datasource.username=postgres
spring.datasource.password=postgres

# Local AWS credentials come from this named profile in ~/.aws/credentials
aws.profile-name=Hometown

# Sign-in for local development. Not secrets: they only unlock your local API.
# Production reads them from OWNER_PASSWORD_HASH and SESSION_SECRET in the server's .env.
# The local password is: local-dev-password
api.password-hash=$2y$10$FHA58SLwu50SpXQu2QBKoO2s33w1SBRBZZUGz7I3wGK2vrY2n2EF2
api.session-secret=local-dev-session-secret-not-a-secret-00000
# http://localhost has no HTTPS, so the cookie can't require it.
api.cookie-secure=false
# Touch ID works on localhost too (browsers allow passkeys there without HTTPS).
# Register one from the running app, then paste its value here.
api.passkey.rp-id=localhost
api.passkey.origin=http://localhost:5173
api.passkey.credentials=
# The Vite dev server runs on another port, so the browser treats it as another origin.
api.cors-allowed-origins=http://localhost:5173
