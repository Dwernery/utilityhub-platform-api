# Datasource is supplied via environment variables (see docker-compose.yml):
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD.
# AWS credentials come from the default provider chain (env vars / instance role).

# Sign-in settings come from environment variables set in docker-compose.yml (from the
# server's .env): API_PASSWORD_HASH, API_SESSION_SECRET, API_PASSKEY_RP_ID and
# API_PASSKEY_CREDENTIALS, which Spring maps to api.password-hash and so on.
# Without the first two the app refuses to start.
# No CORS origins: the web UI is served from the same address as the API.

# nginx terminates HTTPS and forwards X-Forwarded-Proto/-For. Trust them (only from
# private addresses, i.e. nginx) so the app sees the real scheme and client IP.
server.forward-headers-strategy=native
