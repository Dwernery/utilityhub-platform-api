# Shared settings for every profile. Profile files (application-<profile>.properties)
# only contain what differs, and override anything set here.
spring.application.name=platform-api

# Keep database access inside service-layer transactions. When true (Spring Boot's
# default), a session stays open for the whole HTTP request, so lazy-loading can
# silently run extra queries from controllers or during JSON serialization.
spring.jpa.open-in-view=false

# AWS S3
aws.region=us-east-2
aws.s3.bucket-name=utility-hub-library
aws.s3.mcu-bucket-name=utility-hub-mcu
aws.s3.presigned-url-expiration=15
