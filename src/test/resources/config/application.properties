# Test-only settings. Lives in config/ so it is loaded *in addition to*
# src/main/resources/application.properties instead of hiding it (a file with the
# same name at the classpath root would shadow the main one entirely).

# Not a secret: only ever used by tests.
api.token=test-token-0123456789abcdef0123456789abcdef
api.cors-allowed-origins=http://localhost:5173
